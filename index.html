function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return 'No date';let d=new Date(s+'T12:00');return isNaN(d)?'No date':new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(d)}
function dueText(s){let a=new Date(today()),b=new Date(s+'T12:00'),n=Math.round((b-a)/86400000);return n<0?`${-n}d overdue`:n===0?'Due today':n===1?'Due tomorrow':`Due ${fmtDate(s)}`}
function priority(t){let days=t.deadline?(new Date(t.deadline+'T12:00')-new Date(today()))/86400000:9999;return days*100+(t.exam?-20:0)+(t.duration||30)/100}
function pending(){let base=state.tasks.filter(t=>!t.done).sort((a,b)=>priority(a)-priority(b));let ids=(state.todayOrder||[]).filter(id=>base.some(t=>t.id===id));let ordered=ids.map(id=>base.find(t=>t.id===id));return ordered.concat(base.filter(t=>!ids.includes(t.id)))}

function tagClass(s=''){return /phys/i.test(s)?'blue':/math|precal/i.test(s)?'purple':/english/i.test(s)?'red':/span/i.test(s)?'amber':'green'}
function clockSlot(i,dur){let d=new Date(), mins=d.getHours()*60+d.getMinutes()+10+i*15; mins=Math.max(mins,18*60);let h=Math.floor(mins/60)%24,m=mins%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function taskRow(t,i=0){let cat=t.exam?'EXAM':(t.category||'');return `<div class="item ${t.done?'done':''}"><div class="check" onclick="toggleTask('${t.id}')"></div><div class="name clickable" onclick="editTask('${t.id}')">${esc(t.name)}</div><div class="taskCat">${cat?`<span class="tag ${t.exam?'red':'blue'}">${esc(cat)}</span>`:''}</div>${state.auto&&!t.done?`<div class="time">${clockSlot(i,t.duration)}</div>`:''}<div class="time">${t.duration||30}m</div></div>`}
function routineDue(r){if(r.doneDate===today())return true;if(!r.lastDone)return true;let diff=Math.floor((new Date(today()+'T12:00')-new Date(r.lastDone+'T12:00'))/86400000);return diff>=(r.every||1)}
function hmToMin(t){if(!t||!t.includes(':'))return 0;let [h,m]=t.split(':').map(Number);return h*60+m}

function buildDayPlan(){
 let blocks=[],now=new Date(),cursor=Math.max(now.getHours()*60+now.getMinutes()+10,7*60);
 let fixed=visibleEvents().filter(e=>(e.startDate||e.date)===today()&&!e.allDay&&e.start&&e.busy!==false).sort((a,b)=>hmToMin(a.start)-hmToMin(b.start));
 let work=pending().slice(0,8);
 for(const t of work){let dur=Math.max(10,+t.duration||30),next=fixed.find(e=>hmToMin(e.start)>=cursor&&hmToMin(e.start)<cursor+dur);if(next){cursor=Math.max(cursor,hmToMin(next.end||next.start));}blocks.push({kind:'task',start:cursor,end:cursor+dur,name:t.name,subject:t.subject||'Task',id:t.id,duration:dur});cursor+=dur+10}
 for(const e of fixed)blocks.push({kind:'event',start:hmToMin(e.start),end:hmToMin(e.end||e.start)+0,name:e.name,subject:'Calendar',id:e.id,duration:Math.max(0,hmToMin(e.end||e.start)-hmToMin(e.start))});
 state.routines.filter(routineDue).forEach(r=>blocks.push({kind:'routine',start:null,end:null,name:r.name,subject:r.when||'Routine',id:r.id,duration:null}));

function eventInstances(start,end){let out=[];for(const e of visibleEvents()){let dates=[];if(e.allDay&&e.endDate&&e.endDate>e.date){let d=new Date(e.date+'T12:00'),last=new Date(e.endDate+'T12:00'),limit=0;while(d<last&&limit++<500){dates.push(iso(d));d.setDate(d.getDate()+1)}}else dates=[e.date];if(e.repeat&&e.repeat!=='none'){dates=[];let d=new Date(e.date+'T12:00'),limit=0;while(d<=end&&limit++<500){if(d>=start)dates.push(iso(d));if(e.repeat==='daily')d.setDate(d.getDate()+1);else if(e.repeat==='weekly')d.setDate(d.getDate()+7);else if(e.repeat==='monthly')d.setMonth(d.getMonth()+1);else break}}for(const date of dates){let dd=new Date(date+'T12:00');if(dd>=start&&dd<=end)out.push({...e,instanceDate:date})}}return out}

function renderMonth(a){let c=calCfg(),y=a.getFullYear(),m=a.getMonth(),first=new Date(y,m,1,12),start=new Date(first);let offset=(first.getDay()-(c.weekStart||0)+7)%7;start.setDate(start.getDate()-offset);let end=new Date(start);end.setDate(end.getDate()+41);let ev=eventInstances(start,end),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let heads='';for(let i=0;i<7;i++){let idx=((c.weekStart||0)+i)%7;if(!c.showWeekends&&(idx===0||idx===6))continue;heads+=`<div class="calDow">${names[idx]}</div>`}let cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(d.getDate()+i);if(!c.showWeekends&&(d.getDay()===0||d.getDay()===6))continue;let ds=iso(d),items=ev.filter(e=>e.instanceDate===ds);cells+=`<div class="calDay ${d.getMonth()!==m?'muted':''} ${ds===today()?'today':''}" data-date="${ds}" ondblclick="addEvent('${ds}')" ondragover="event.preventDefault()" ondrop="dropEvent(event,'${ds}')"><div class="calDayNum">${d.getDate()}</div>${items.slice(0,4).map(e=>`<div class="calEvent" draggable="true" ondragstart="dragEvent(event,'${e.id}')" onclick="event.stopPropagation();${e.external?`openGoogleEvent('${e.id}')`:`editEvent('${e.id}')`}" ondblclick="event.stopPropagation()" style="border-left-color:${calColor(e)}">${e.allDay?'':(e.start||'')+' '}${esc(e.name)}</div>`).join('')}${items.length>4?`<div class="time">+${items.length-4} more</div>`:''}</div>`}let cols=c.showWeekends?7:5;return `<div class="calMonth" style="grid-template-columns:repeat(${cols},minmax(90px,1fr))">${heads}${cells}</div>`}
function renderTimeGrid(a,n){let start=new Date(a);if(n===7){let delta=(start.getDay()-(calCfg().weekStart||0)+7)%7;start.setDate(start.getDate()-delta)}let days=[];for(let i=0;i<n;i++){let d=new Date(start);d.setDate(d.getDate()+i);if(!calCfg().showWeekends&&(d.getDay()===0||d.getDay()===6)){n++;continue}days.push(d)}let ev=eventInstances(days[0],days[days.length-1]);let heads=`<div class="weekHead"></div>`+days.map(d=>`<div class="weekHead"><b>${d.toLocaleDateString(undefined,{weekday:'short'})}</b><br>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`).join('');let rows=heads;for(let h=6;h<24;h++){rows+=`<div class="timeCell">${String(h).padStart(2,'0')}:00</div>`;for(const d of days){let ds=iso(d),items=ev.filter(e=>e.instanceDate===ds&&!e.allDay&&parseInt(e.start||'0')===h);rows+=`<div class="timeDay" ondblclick="addEvent('${ds}','${String(h).padStart(2,'0')}:00')">${items.map(e=>{let sp=(e.start||'00:00').split(':').map(Number),ep=(e.end||e.start||'00:00').split(':').map(Number),sm=(sp[1]||0)/60,em=(ep[0]+ep[1]/60)-(sp[0]+sp[1]/60);return `<div class="timeEvent" onclick="editEvent('${e.id}')" style="top:${sm*54}px;height:${Math.max(24,em*54)}px;border-left-color:${calColor(e)}">${e.start} ${esc(e.name)}</div>`}).join('')}</div>`}}return `<div class="weekGrid" style="--days:${days.length}">${rows}</div>`}

 let c=gcalConfig();if(!c.clientId)return setupGoogleCalendar();
 if(!window.google?.accounts?.oauth2)return toast('Google sign-in is still loading');

async function refreshGoogleCalendar(){

 gcal.status='Syncing';renderAll();
 try{
  let now=new Date(),from=new Date(now);from.setDate(from.getDate()-14);let to=new Date(now);to.setDate(to.getDate()+90);
  let url='https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin='+encodeURIComponent(from.toISOString())+'&timeMax='+encodeURIComponent(to.toISOString());

 }catch(e){gcal.status='Sync error';renderAll();toast('Could not sync Google Calendar')}
}

function parseNatural(v){let duration=30,m=v.match(/\b(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/i);if(m){duration=m[2].toLowerCase().startsWith('h')?Math.round(+m[1]*60):+m[1];v=v.replace(m[0],'')}let deadline=today();if(/\btomorrow\b/i.test(v)){deadline=addDays(1);v=v.replace(/\btomorrow\b/i,'')}else if(/\btoday\b/i.test(v)){v=v.replace(/\btoday\b/i,'')}else{let names=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];let hit=names.findIndex(n=>new RegExp('\\b'+n+'\\b','i').test(v));if(hit>=0){let d=new Date(),delta=(hit-d.getDay()+7)%7||7;d.setDate(d.getDate()+delta);deadline=iso(d);v=v.replace(new RegExp('\\b'+names[hit]+'\\b','i'),'')}}let sm=v.match(/#([\w-]+)/);let subject=sm?sm[1]:'';if(sm)v=v.replace(sm[0],'');return{name:v.replace(/[\/·]+/g,' ').replace(/\s+/g,' ').trim(),deadline,duration,subject}}

  syncEventDates(); let allDay=vall.classList.contains('on');
  if(!allDay)syncEventTimes();
  return{name:vn.value.trim(),date:vsd.value,startDate:vsd.value,endDate:ved.value,allDay,start:allDay?'':vs.value,end:allDay?'':ve.value,calendarId:vcal.value,repeat:vrep.value,location:vloc.value,link:vlink.value,description:vdesc.value}
}
function addEvent(date=today(),start='16:00'){modal('New event',eventFields({startDate:date,endDate:date,start,end:start==='16:00'?'17:00':String(Math.min(23,+start.slice(0,2)+1)).padStart(2,'0')+':'+start.slice(3)}),()=>{let x=readEventFields();if(!x.name)return;state.events.push({id:uid(),...x});closeModal();save();toast('Event added')})}
function editEvent(id){let e=state.events.find(x=>x.id===id);if(!e)return;modal('Edit event',eventFields(e)+`<button class="btn danger" onclick="remove('events','${id}');closeModal()">Delete event</button>`,()=>{Object.assign(e,readEventFields());closeModal();save();toast('Event updated')})}
function addEC(){modal('New activity',`<div class="field"><label>Name</label><input id="cn"></div><div class="two"><div class="field"><label>Type</label><select id="ct">${ecTypeOptions()}</select></div><div class="field"><label>Deadline status</label><select id="cdm" onchange="document.querySelector('#cdWrap').style.display=this.value==='date'?'block':'none'"><option value="none">No deadline</option><option value="ongoing">Ongoing</option><option value="date">Has deadline</option></select></div></div><div class="field" id="cdWrap" style="display:none"><label>Deadline</label><input id="cd" type="date" value="${addDays(7)}"></div>`,()=>{state.ecs.push({id:uid(),name:cn.value,type:ct.value,deadlineMode:cdm.value,deadline:cdm.value==='date'?cd.value:''});closeModal();save()})}
function addResource(){modal('New resource',`<div class="field"><label>Name</label><input id="ln"></div><div class="field"><label>URL</label><input id="lu" placeholder="https://..."></div><div class="field"><label>Tag</label><input id="lt" placeholder="School"></div>`,()=>{let u=lu.value;if(u&&!/^https?:\/\//i.test(u))u='https://'+u;state.resources.push({id:uid(),name:ln.value,url:u,tag:lt.value||'Link'});closeModal();save()})}
function remove(k,id){state[k]=state[k].filter(x=>x.id!==id);save()}
let focusInt,focusStart,focusTaskObj;function startFocus(id){focusTaskObj=state.tasks.find(x=>x.id===id);focusStart=Date.now();let sec=(focusTaskObj.duration||25)*60;focusOverlay.innerHTML=`<div class="modal focus"><div class="eyebrow">FOCUS</div><h3>${esc(focusTaskObj.name)}</h3><div class="timer" id="timer"></div><div class="row" style="justify-content:center"><button class="btn primary" onclick="finishFocus(true)">Finish</button><button class="btn" onclick="finishFocus(false)">Stop</button></div></div>`;focusOverlay.classList.add('show');function tick(){let left=Math.max(0,sec-Math.floor((Date.now()-focusStart)/1000)),m=Math.floor(left/60),s=left%60;timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(!left)finishFocus(true)}tick();focusInt=setInterval(tick,1000)}
function finishFocus(done){clearInterval(focusInt);let mins=Math.max(1,Math.round((Date.now()-focusStart)/60000));state.sessions.push({id:uid(),task:focusTaskObj.name,minutes:mins,at:Date.now()});if(done)focusTaskObj.done=true;focusOverlay.classList.remove('show');save();toast(`${mins}m focus logged`)}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lucifer-data.json';a.click();URL.revokeObjectURL(a.href)}function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
navs();renderAll();initCloud();setInterval(()=>{if($('#home').classList.contains('active'))renderHome()},60000);
</script></body></html>
